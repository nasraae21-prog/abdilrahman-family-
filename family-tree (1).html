<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;700&display=swap" rel="stylesheet">
<style id="st">
:root{--bg:#f6e9c6;--tt:#5a3a1a;--paper:#fcf3d9;--ink:#5a3a1a;--mute:#9a7a52;--wood:#b07d45;--gold:#e8cf94;--acc:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26324a;--tt:#f6e9c6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tt);font-family:"Handjet","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;font-size:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px}
h1{font-size:1.7rem;margin:0}
#chip{background:var(--paper);color:var(--ink);border:3px solid var(--wood);border-radius:12px;padding:0 12px;font-size:1.05rem;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-size:1.05rem;font-weight:700;padding:5px 14px;border:3px solid var(--wood);border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--wood);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
button.p{background:#7cc65e;color:#fff;border-color:#4a9a3a;box-shadow:0 3px 0 #4a9a3a}
button.d{color:#c0392b}
.tabs{display:flex;gap:10px;padding:4px 14px 10px}.tabs button{flex:1}.tabs button.on{background:var(--gold)}
.bar{position:fixed;z-index:20;left:10px;right:10px;bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);border:3px solid var(--wood);border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-height:50vh;overflow:auto;box-shadow:0 8px 24px #0004}
.bar[hidden]{display:none}
.bar .who{width:100%;color:var(--mute)}
.bar input{flex:1 1 140px;min-width:0;padding:6px 12px;border:3px solid var(--wood);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:1.1rem}
.pal{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute)}
.pal i{width:28px;height:28px;border:3px solid var(--wood);border-radius:8px;cursor:pointer;display:inline-block}
.dock{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--paper);border:3px solid var(--wood);border-radius:22px;padding:8px 10px;box-shadow:0 8px 24px #0004}
.dock button{width:46px;height:42px;padding:0;font-size:1.5rem;line-height:1}
#edt{background:#7cc65e;color:#fff;border-color:#4a9a3a;box-shadow:0 3px 0 #4a9a3a}
.view{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;min-height:0;background:linear-gradient(#bfe6f7,#e4f3f3 50%,var(--bg) 72%)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cl{position:absolute;left:-120px;width:8px;height:8px;box-shadow:16px 0 #fff,24px 0 #fff,8px 8px #fff,16px 8px #fff,24px 8px #fff,32px 8px #fff,40px 8px #fff,0 16px #f1f8fc,8px 16px #fff,16px 16px #fff,24px 16px #fff,32px 16px #fff,40px 16px #fff,48px 16px #f1f8fc;animation:cl 70s linear infinite}
.cl:nth-child(1){top:4%;transform:scale(1.6)}.cl:nth-child(2){top:14%;animation-delay:-30s;animation-duration:90s}.cl:nth-child(3){top:26%;animation-delay:-55s;transform:scale(1.2)}
#stage{position:absolute;left:0;top:0;width:max-content;padding:34px 24px;transform-origin:0 0;direction:ltr}
#stage ul{display:flex;justify-content:center;padding:62px 0 0;margin:0;list-style:none;position:relative}
#stage>ul{padding-top:0}
#stage li{padding:0 8px;text-align:center;position:relative}
.cn{position:absolute;left:-6%;top:-6%;width:112%;height:116%;background-size:100% 100%;image-rendering:pixelated;pointer-events:none}
.tk{position:absolute;left:50%;top:100%;margin:-30px 0 0 -60px;width:120px;height:150px;pointer-events:none;clip-path:polygon(22% 0,78% 0,82% 60%,100% 100%,0 100%,18% 60%);background:repeating-linear-gradient(90deg,#6d4524 0 10px,#8d5d30 10px 30px,#a8713b 30px 50px,#8d5d30 50px 70px,#6d4524 70px 90px,#8d5d30 90px 120px)}
.card{direction:rtl;position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:color-mix(in srgb,var(--c,#fcf3d9) 20%,var(--paper));border:3px solid var(--wood);border-radius:10px;padding:6px 14px;min-width:92px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:20px;color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold),0 4px 0 rgba(90,55,20,.35),0 8px 14px rgba(0,0,0,.12)}
.card.root{font-size:24px}
.card.sel{outline:3px solid var(--acc);outline-offset:3px}
.card.dead{filter:grayscale(1);opacity:.85}
.card b{font-weight:700;font-size:1.1em}
.card b::after{content:"";display:block;height:4px;margin-top:2px;background:var(--c,var(--gold));border-radius:2px}
.sp{font-size:.85em;display:flex;align-items:center;gap:4px}
.heart{display:inline-flex;line-height:0;animation:beat 1.2s ease-in-out infinite}
.more{position:absolute;top:-12px;left:-10px;background:var(--acc);color:#fff;font-size:15px;padding:0 8px;border-radius:10px}
.anim .card{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.hint{text-align:center;color:var(--tt);font-size:1rem;padding:6px 10px}
#stage{will-change:transform}
.lvnew .card.nw{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;animation-delay:0s!important}
.cp{position:relative;display:inline-flex;align-items:center;direction:ltr}
.hr{position:relative;width:42px;height:34px;display:flex;align-items:center;justify-content:center}
.hr::before{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:5px;margin-top:-2px;background:#9a6a3a}
.hr .heart{position:relative;z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.card.spc{background:color-mix(in srgb,var(--acc) 10%,var(--paper))}
.cn{filter:drop-shadow(0 8px 0 rgba(20,60,20,.25))}
.tk{width:170px;height:170px;margin:-30px 0 0 -85px;clip-path:polygon(30% 0,70% 0,74% 55%,100% 100%,0 100%,26% 55%)}
.cl:nth-child(1){animation-delay:-20s}.cl:nth-child(4){top:8%;animation-delay:-10s;animation-duration:100s}.cl:nth-child(5){top:20%;animation-delay:-40s;animation-duration:110s;transform:scale(.9)}.cl:nth-child(6){top:34%;animation-delay:-70s;animation-duration:80s;transform:scale(1.4)}
.bd{position:absolute;left:-60px;width:4px;height:4px;background:#4a3a2a;box-shadow:4px 4px 0 #4a3a2a,8px 8px 0 #4a3a2a,12px 4px 0 #4a3a2a,16px 0 0 #4a3a2a;animation:bdf 18s linear infinite,flap .55s ease-in-out infinite}
.bd:nth-child(7){top:10%;animation-duration:17s,.55s;animation-delay:-2s,0s}.bd:nth-child(8){top:18%;animation-duration:22s,.65s;animation-delay:-9s,-.2s;transform:scale(.8)}.bd:nth-child(9){top:30%;animation-duration:26s,.5s;animation-delay:-15s,-.1s;transform:scale(1.2)}.bd:nth-child(10){top:22%;animation-duration:19s,.6s;animation-delay:-6s,-.3s}.bd:nth-child(11){top:36%;animation-duration:30s,.7s;animation-delay:-20s,0s;transform:scale(.9)}
@keyframes bdf{to{left:110%}}
@keyframes flap{50%{box-shadow:4px -4px 0 #4a3a2a,8px -8px 0 #4a3a2a,12px -4px 0 #4a3a2a,16px 0 0 #4a3a2a}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes beat{50%{transform:scale(1.25)}}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes cl{to{left:110%}}
@media (prefers-reduced-motion:reduce){.fx{display:none}.heart{animation:none}}
</style>
</head>
